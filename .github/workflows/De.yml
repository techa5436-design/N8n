name: Delete All Repository Content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete content
        run: |
          git config user.name "bot"
          git config user.email "bot@example.com"
          rm -rf !(\.git|\.github)
          git add -A
          git commit -m "Delete all content" --allow-empty
          git push
