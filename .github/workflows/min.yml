name: Build APK

# Builds the Android APK on GitHub's runners so you always have a downloadable build
# without needing a local Android Studio. Runs on every push / pull request, and can be
# triggered manually from the Actions tab.

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK and sets ANDROID_HOME / ANDROID_SDK_ROOT.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Provides the Gradle CLI (matches the version pinned in gradle-wrapper.properties).
      - name: Set up Gradle 8.4
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # Generates the Gradle wrapper (the wrapper JAR is intentionally not committed),
      # then uses it to download Gradle 8.4 pinned in gradle-wrapper.properties.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.4

      - name: Grant run permission to the wrapper
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Uploads app/build/outputs/apk/debug/app-debug.apk as a downloadable artifact.
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: agent-game-1-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
