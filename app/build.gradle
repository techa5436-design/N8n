plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.agentgame.one'
    compileSdk 34

    defaultConfig {
        applicationId "com.agentgame.one"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // jMonkeyEngine native libraries ship as per-ABI .so files.
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// jMonkeyEngine 3.5.2 stable on Maven Central.
def jmeVersion = "3.5.2-stable"

dependencies {
    implementation "org.jmonkeyengine:jme3-core:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-android:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-android-native:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-effects:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-plugins:$jmeVersion"
    implementation "org.jmonkeyengine:jme3-terrain:$jmeVersion"
}
